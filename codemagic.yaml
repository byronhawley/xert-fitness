workflows:
  ios-verify:
    name: XERT iOS Verify
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          # Verify the commit actually pushed to main rather than filtering on
          # a pull request's destination branch.
          source: true
      cancel_previous_builds: true
    environment:
      xcode: latest
      cocoapods: default
      node: 22
      groups:
        # Shared team signing key group.
        - appstore
        # XERT-specific Supabase/Vercel runtime values.
        - xert_env
      vars:
        BUNDLE_ID: com.xertfitness.app
        IOS_DIRECTORY: ios/XertFitnessApp
        XCODE_PROJECT: XertFitness.xcodeproj
        XCODE_SCHEME: XertFitness
        EXPORT_TEST_ATTACHMENTS: "true"
    scripts:
      - name: Write XERT runtime configuration
        script: |
          set -e
          # Verification only compiles and runs unit tests, so live service values
          # are optional here. Release builds below remain strict.
          SUPABASE_URL_VALUE="${SUPABASE_URL:-https://placeholder.supabase.co}"
          SUPABASE_ANON_KEY_VALUE="${SUPABASE_ANON_KEY:-placeholder-anon-key}"
          VERCEL_BASE_URL_VALUE="${VERCEL_BASE_URL:-https://example.com}"

          escape_xcconfig_url() {
            printf '%s' "$1" | sed 's#//#/$()/#'
          }

          cat > "$CM_BUILD_DIR/$IOS_DIRECTORY/Config.xcconfig" <<EOF
          SUPABASE_URL = $(escape_xcconfig_url "$SUPABASE_URL_VALUE")
          SUPABASE_ANON_KEY = $SUPABASE_ANON_KEY_VALUE
          VERCEL_BASE_URL = $(escape_xcconfig_url "$VERCEL_BASE_URL_VALUE")
          EOF
      - name: Install XcodeGen when needed
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIRECTORY"
          bash ci/configure-universal-links.sh
          xcodegen generate
      - name: Run Swift unit tests
        script: |
          set -e
          cd "$CM_BUILD_DIR/$IOS_DIRECTORY"
          bash ci/run-swift-tests.sh
    artifacts:
      - ios/XertFitnessApp/build/test-results.xcresult
      - ios/XertFitnessApp/build/test-attachments/**/*.png
      - ios/XertFitnessApp/build/test-attachments/**/*.json
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: XERT iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: ios-testflight-*
          include: true
      cancel_previous_builds: false
    integrations:
      # Shared-team App Store Connect API key integration.
      app_store_connect: codemagic
    environment:
      groups:
        # Contains the stable distribution certificate private key.
        - appstore
        # Contains XERT-specific Supabase/Vercel runtime values.
        - xert_env
      xcode: latest
      cocoapods: default
      node: 22
      vars:
        BUNDLE_ID: com.xertfitness.app
        IOS_DIRECTORY: ios/XertFitnessApp
        XCODE_PROJECT: XertFitness.xcodeproj
        XCODE_SCHEME: XertFitness
        EXPECTED_SUPABASE_HOST: ugmkwoapjcpiucsrxwzt.supabase.co
        EXPECTED_VERCEL_HOST: xert-fitness.vercel.app
    scripts:
      - name: Write XERT runtime configuration
        script: |
          set -e
          : "${SUPABASE_URL:?Add SUPABASE_URL as a Codemagic application environment variable.}"
          : "${SUPABASE_ANON_KEY:?Add SUPABASE_ANON_KEY as a Codemagic application environment variable.}"
          : "${VERCEL_BASE_URL:?Add VERCEL_BASE_URL as a Codemagic application environment variable.}"

          node "$CM_BUILD_DIR/scripts/validate-public-runtime-config.mjs"

          escape_xcconfig_url() {
            printf '%s' "$1" | sed 's#//#/$()/#'
          }

          cat > "$CM_BUILD_DIR/$IOS_DIRECTORY/Config.xcconfig" <<EOF
          SUPABASE_URL = $(escape_xcconfig_url "$SUPABASE_URL")
          SUPABASE_ANON_KEY = $SUPABASE_ANON_KEY
          VERCEL_BASE_URL = $(escape_xcconfig_url "$VERCEL_BASE_URL")
          EOF
      - name: Verify production service contract
        script: |
          set -e
          STRICT_PRODUCTION_SERVICES="${REQUIRE_PRODUCTION_SERVICES:-false}"

          report_service_issue() {
            echo "::warning:: $1"
            if [ "$STRICT_PRODUCTION_SERVICES" = "true" ]; then
              echo "::error:: REQUIRE_PRODUCTION_SERVICES=true, so this readiness warning is release-blocking."
              exit 1
            fi
          }

          # These are public URLs, so on failure we can safely dump the first bytes
          # to expose the exact malformation (missing scheme, quotes, whitespace, http://).
          url_diag() {
            printf '::error:: %s must use HTTPS. Got length=%s, first bytes:\n' "$1" "${#2}"
            printf '%s' "$2" | head -c 32 | od -An -c
            echo "Fix the value in the Codemagic 'xert_env' variable group: it must start with https:// (no quotes, no spaces)."
            exit 1
          }
          case "$SUPABASE_URL" in https://*) ;; *) url_diag SUPABASE_URL "$SUPABASE_URL" ;; esac
          case "$VERCEL_BASE_URL" in https://*) ;; *) url_diag VERCEL_BASE_URL "$VERCEL_BASE_URL" ;; esac

          # Values pasted into Codemagic sometimes carry stray line breaks or spaces;
          # those become malformed HTTP requests (opaque 400s), so name the exact
          # offender before any network call. Never prints the value itself.
          ws_guard() {
            case "$2" in
              *$'\n'*|*$'\r'*) echo "::error:: $1 contains a line break - delete it in the xert_env group and re-add it as ONE line."; exit 1 ;;
              *' '*) echo "::error:: $1 contains a space - delete it in the xert_env group and re-add it without spaces."; exit 1 ;;
            esac
          }
          ws_guard SUPABASE_URL "$SUPABASE_URL"
          ws_guard VERCEL_BASE_URL "$VERCEL_BASE_URL"
          ws_guard SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY"

          curl --silent --show-error --fail --max-time 20 "$VERCEL_BASE_URL/" >/dev/null
          EXPECTED_PAYMENT_CONTRACT="stripe-launch-2026-07-17"
          COMMERCE_HEADERS="$(mktemp)"
          COMMERCE_CODE="$(curl --silent --show-error --max-time 20 \
            --dump-header "$COMMERCE_HEADERS" \
            --output /dev/null --write-out '%{http_code}' \
            --request HEAD "$VERCEL_BASE_URL/api/checkout")" || COMMERCE_CODE=000
          PAYMENT_CONTRACT="$(tr -d '\r' < "$COMMERCE_HEADERS" | awk 'tolower($1) == "x-xert-payment-contract:" { value=$2 } END { print value }')"
          rm -f "$COMMERCE_HEADERS"
          if [ "$PAYMENT_CONTRACT" != "$EXPECTED_PAYMENT_CONTRACT" ]; then
            report_service_issue "Production is stale: expected payment contract $EXPECTED_PAYMENT_CONTRACT but received ${PAYMENT_CONTRACT:-no contract header}. Redeploy current main."
          fi
          if [ "$COMMERCE_CODE" != "204" ]; then
            case "$COMMERCE_CODE" in
              503) echo "Add APP_BASE_URL, SUPABASE_SERVICE_ROLE_KEY, STRIPE_SECRET_KEY, and STRIPE_WEBHOOK_SECRET to Vercel Production, then redeploy." ;;
              404) echo "The checkout readiness contract was not deployed from main." ;;
              000) echo "The commerce environment check timed out or could not be reached." ;;
            esac
            report_service_issue "Commerce environment gate expected HTTP 204 but received $COMMERCE_CODE."
          fi

          API_BODY="$(mktemp)"
          API_CODE="$(curl --silent --show-error --max-time 20 \
            -o "$API_BODY" -w '%{http_code}' \
            "$VERCEL_BASE_URL/api/checkout" \
            -H 'Authorization: Bearer codemagic-preflight-invalid-token' \
            -H 'Content-Type: application/json' \
            --data '{}')" || API_CODE=000
          if [ "$API_CODE" != "401" ]; then
            echo "::warning:: Production checkout preflight expected HTTP 401 but received $API_CODE. Response body:"
            head -c 300 "$API_BODY"; echo
            case "$API_CODE" in
              500) echo "Add STRIPE_SECRET_KEY, SUPABASE_URL, and SUPABASE_SERVICE_ROLE_KEY to the Vercel Production environment, then redeploy." ;;
              404) echo "The /api/checkout Vercel Function was not deployed." ;;
              000) echo "The checkout function timed out or could not be reached." ;;
            esac
            rm -f "$API_BODY"
            report_service_issue "Checkout is not production-ready; the signed app can still be distributed for TestFlight testing."
          fi
          rm -f "$API_BODY"

          REFUND_BODY="$(mktemp)"
          REFUND_CODE="$(curl --silent --show-error --max-time 20 \
            -o "$REFUND_BODY" -w '%{http_code}' \
            "$VERCEL_BASE_URL/api/admin-refund-order" \
            -H 'Content-Type: application/json' \
            --data '{}')" || REFUND_CODE=000
          if [ "$REFUND_CODE" != "401" ]; then
            echo "::warning:: Production refund preflight expected HTTP 401 but received $REFUND_CODE. Response body:"
            head -c 300 "$REFUND_BODY"; echo
            case "$REFUND_CODE" in
              500) echo "Add STRIPE_SECRET_KEY, SUPABASE_URL, and SUPABASE_SERVICE_ROLE_KEY to the Vercel Production environment, then redeploy." ;;
              404) echo "The /api/admin-refund-order Vercel Function was not deployed." ;;
              000) echo "The refund function timed out or could not be reached." ;;
            esac
            rm -f "$REFUND_BODY"
            report_service_issue "Admin refunds are not production-ready; TestFlight upload will continue."
          fi
          rm -f "$REFUND_BODY"

          RECONCILE_BODY="$(mktemp)"
          RECONCILE_CODE="$(curl --silent --show-error --max-time 20 \
            -o "$RECONCILE_BODY" -w '%{http_code}' \
            "$VERCEL_BASE_URL/api/admin-reconcile-order" \
            -H 'Content-Type: application/json' \
            --data '{}')" || RECONCILE_CODE=000
          if [ "$RECONCILE_CODE" != "401" ]; then
            echo "::warning:: Production reconciliation preflight expected HTTP 401 but received $RECONCILE_CODE. Response body:"
            head -c 300 "$RECONCILE_BODY"; echo
            case "$RECONCILE_CODE" in
              500) echo "Add STRIPE_SECRET_KEY, SUPABASE_URL, and SUPABASE_SERVICE_ROLE_KEY to the Vercel Production environment, then redeploy." ;;
              404) echo "The /api/admin-reconcile-order Vercel Function was not deployed." ;;
              000) echo "The reconciliation function timed out or could not be reached." ;;
            esac
            rm -f "$RECONCILE_BODY"
            report_service_issue "Checkout reconciliation is not production-ready; TestFlight upload will continue."
          fi
          rm -f "$RECONCILE_BODY"

          CLASS_NOTICE_BODY="$(mktemp)"
          CLASS_NOTICE_CODE="$(curl --silent --show-error --max-time 20 \
            -o "$CLASS_NOTICE_BODY" -w '%{http_code}' \
            "$VERCEL_BASE_URL/api/admin-publish-announcement" \
            -H 'Content-Type: application/json' \
            --data '{"action":"notify_class_cancellation"}')" || CLASS_NOTICE_CODE=000
          if [ "$CLASS_NOTICE_CODE" != "401" ]; then
            echo "::error:: Class cancellation notification preflight expected HTTP 401 but received $CLASS_NOTICE_CODE."
            head -c 300 "$CLASS_NOTICE_BODY"; echo
            rm -f "$CLASS_NOTICE_BODY"
            exit 1
          fi
          rm -f "$CLASS_NOTICE_BODY"

          WEBHOOK_BODY="$(mktemp)"
          WEBHOOK_CODE="$(curl --silent --show-error --max-time 20 \
            -o "$WEBHOOK_BODY" -w '%{http_code}' \
            "$VERCEL_BASE_URL/api/stripe-webhook" \
            -H 'Stripe-Signature: t=0,v1=codemagic-preflight-invalid-signature' \
            -H 'Content-Type: application/json' \
            --data '{}')" || WEBHOOK_CODE=000
          if [ "$WEBHOOK_CODE" != "400" ]; then
            echo "::warning:: Production Stripe webhook preflight expected HTTP 400 but received $WEBHOOK_CODE. Response body:"
            head -c 300 "$WEBHOOK_BODY"; echo
            case "$WEBHOOK_CODE" in
              503) echo "Add STRIPE_WEBHOOK_SECRET and the other server secrets to the Vercel Production environment, then redeploy." ;;
              404) echo "The /api/stripe-webhook Vercel Function was not deployed." ;;
              000) echo "The Stripe webhook function timed out or could not be reached." ;;
            esac
            rm -f "$WEBHOOK_BODY"
            report_service_issue "The Stripe webhook is not production-ready; TestFlight upload will continue."
          fi
          rm -f "$WEBHOOK_BODY"

          CAP_BODY="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error --max-time 20 \
            -o "$CAP_BODY" -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/rpc/xert_public_capabilities" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            --data '{}')" || HTTP_CODE=000
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error:: Capability RPC failed with HTTP $HTTP_CODE. Response body:"
            head -c 300 "$CAP_BODY"; echo
            case "$HTTP_CODE" in
              404) echo "xert_public_capabilities is missing - run the required upgrade SQL files listed in src/lib/schemaCapabilities.js." ;;
              401|403) echo "The anon key was rejected - re-check SUPABASE_ANON_KEY in the xert_env group." ;;
              400) echo "Malformed request - SUPABASE_URL or SUPABASE_ANON_KEY contains stray characters." ;;
              000) echo "No HTTP response - SUPABASE_URL may be unreachable." ;;
            esac
            rm -f "$CAP_BODY"
            exit 1
          fi
          CAPABILITIES="$(cat "$CAP_BODY")"
          rm -f "$CAP_BODY"
          node -e '
            const rows = JSON.parse(process.argv[1]);
            const installed = new Set(rows.map(row => row.capability));
            const required = [
              "admin_role_safety",
              "audited_credit_grants",
              "booking_waitlist_withdrawal",
              "member_cancellation_receipt",
              "member_booking_switch_guard",
              "member_onboarding_foundation",
              "member_activation_cockpit",
              "member_waitlist_join",
              "waitlist_fifo_promotion",
              "attendance_roll_call",
              "attendance_request_resolution_guard",
              "class_session_update_guard",
              "product_update_guard",
              "stripe_refund_reconciliation",
              "checkout_reconciliation",
              "stripe_payment_fulfillment",
              "guarded_payment_activation",
              "payment_activation_drift_guard",
              "admin_settings_singleton",
              "stripe_pending_order_guard",
              "stripe_order_terms_snapshot",
              "stripe_webhook_ledger",
              "member_announcements",
              "announcement_receipts",
              "announcement_actions",
              "announcement_archival",
              "booking_time_conflict_guard",
              "admin_member_notes",
              "schedule_blackout_guard",
              "database_security_hardening",
              "rls_policy_performance",
              "request_status_audit",
              "member_push_notifications",
              "credit_expiry_follow_up",
              "member_pt_request_tracking",
              "public_form_integrity",
              "lead_pipeline_audit",
              "schedule_change_audit",
              "content_change_audit",
              "booking_lifecycle_audit",
              "class_cancellation_notifications",
              "admin_daily_operations",
              "schedule_optimistic_locking",
              "shared_admin_optimistic_locking",
              "catalog_optimistic_locking",
              "product_commercial_terms_guard",
              "targeted_member_notices",
              "waitlist_promotion_notifications",
              "booking_decision_notifications",
              "staff_assisted_booking",
              "owner_stripe_price_provisioning",
              "forms_surveys_builder",
              "form_response_snapshots",
              "fitbox_zapier_bridge",
              "fitbox_get_user_refresh",
              "fitbox_live_mirror",
              "email_notifications",
              "form_prerequisites",
              "casual_visit_payments",
              "three_day_visitor_pass",
              "three_month_membership",
              "visitor_pass_pricing",
              "class_attendee_search",
              "signed_document_copies",
              "booking_integrity_overhaul",
              "booking_overhaul_repair",
              "booking_repair_followups",
              "staff_roster",
              "staff_roster_push_reliability",
              "staff_roster_coach_dashboard",
              "pt_booking",
              "staff_roster_part_month",
              "staff_roster_sms",
            ];
            const missing = required.filter(item => !installed.has(item));
            if (missing.length) {
              console.error(`::error:: Missing production database capabilities: ${missing.join(", ")}`);
              process.exit(1);
            }
            console.log("Production service contract verified.");
          ' "$CAPABILITIES"
      - name: Report production push delivery readiness
        script: |
          set -e
          PUSH_BODY="$(mktemp)"
          PUSH_STATUS="$(curl -sS -o "$PUSH_BODY" -w '%{http_code}' "$VERCEL_BASE_URL/api/push-health")"
          if [ "$PUSH_STATUS" != "200" ]; then
            echo "::warning:: Push health returned HTTP $PUSH_STATUS. TestFlight upload will continue."
            cat "$PUSH_BODY"
            rm -f "$PUSH_BODY"
            if [ "${REQUIRE_PRODUCTION_SERVICES:-false}" = "true" ]; then exit 1; fi
            exit 0
          fi
          if ! node -e '
            const health = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (health.ready !== true) {
              console.error("::warning:: Production APNs delivery is not configured in Vercel; TestFlight upload will continue.");
              process.exit(1);
            }
            console.log("Production APNs delivery verified.");
          ' "$PUSH_BODY"; then
            rm -f "$PUSH_BODY"
            if [ "${REQUIRE_PRODUCTION_SERVICES:-false}" = "true" ]; then
              echo "::error:: REQUIRE_PRODUCTION_SERVICES=true, so APNs readiness is release-blocking."
              exit 1
            fi
            exit 0
          fi
          rm -f "$PUSH_BODY"
      - name: Install XcodeGen when needed
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIRECTORY"
          bash ci/configure-universal-links.sh
          xcodegen generate
      - name: Run Swift unit tests
        script: |
          set -e
          cd "$CM_BUILD_DIR/$IOS_DIRECTORY"
          bash ci/run-swift-tests.sh
      - name: Set up code signing (reuse the shared distribution certificate)
        script: |
          set -e
          cd "$CM_BUILD_DIR/$IOS_DIRECTORY"
          keychain initialize
          SIGNING_KEY="${CERTIFICATE_PRIVATE_KEY:-${CERT_PRIVATE_KEY:-$IOS_DISTRIBUTION_PRIVATE_KEY}}"
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error:: No signing key set - add CERTIFICATE_PRIVATE_KEY as a Secure var in group 'appstore'."
            exit 1
          fi
          CERT_KEY="$(mktemp)"
          trap 'rm -f "$CERT_KEY"' EXIT
          printf '%s' "$SIGNING_KEY" > "$CERT_KEY"
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$CERT_KEY"
          keychain add-certificates
          xcode-project use-profiles
      - name: Stamp incrementing build number
        script: |
          set -e
          cd "$CM_BUILD_DIR/$IOS_DIRECTORY"
          agvtool new-version -all "$(date +%s)"
      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/$IOS_DIRECTORY"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Verify signed release bundle (release truth)
        script: |
          set -e
          cd "$CM_BUILD_DIR/$IOS_DIRECTORY"
          IPA_PATH="$(find build/ios/ipa -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error:: no IPA under build/ios/ipa"
            exit 1
          fi
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          unzip -q "$IPA_PATH" -d "$WORK"
          APP_PATH="$(find "$WORK/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error:: no .app inside IPA Payload"
            exit 1
          fi

          codesign -d --entitlements :- "$APP_PATH" > "$WORK/entitlements.plist"
          cat "$WORK/entitlements.plist"
          grep -q "aps-environment" "$WORK/entitlements.plist" || {
            echo "::error:: Missing aps-environment entitlement!"
            exit 1
          }
          grep -q "application-identifier" "$WORK/entitlements.plist" || {
            echo "::error:: Missing application-identifier entitlement!"
            exit 1
          }
          ASSOCIATED_DOMAINS="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.associated-domains' "$WORK/entitlements.plist" 2>/dev/null || true)"
          if [ "${ENABLE_UNIVERSAL_LINKS:-false}" = "true" ]; then
            printf '%s' "$ASSOCIATED_DOMAINS" | grep -Fq "applinks:xert-fitness.vercel.app" || {
              echo "::error:: Universal Links were enabled but the signed IPA is missing the XERT Associated Domains entitlement."
              exit 1
            }
          elif [ -n "$ASSOCIATED_DOMAINS" ]; then
            echo "::error:: Signed IPA contains Associated Domains while ENABLE_UNIVERSAL_LINKS is not true."
            exit 1
          fi

          INFO_PLIST="$APP_PATH/Info.plist"
          [ -f "$INFO_PLIST" ] || { echo "::error:: signed app Info.plist is missing"; exit 1; }
          SIGNED_BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw -o - "$INFO_PLIST")"
          [ "$SIGNED_BUNDLE_ID" = "$BUNDLE_ID" ] || {
            echo "::error:: Signed bundle identifier is $SIGNED_BUNDLE_ID, expected $BUNDLE_ID."
            exit 1
          }
          [ "$(plutil -extract ITSAppUsesNonExemptEncryption raw -o - "$INFO_PLIST")" = "false" ] || {
            echo "::error:: ITSAppUsesNonExemptEncryption must be false for the app's exempt HTTPS/Apple cryptography usage."
            exit 1
          }
          IPAD_ORIENTATIONS="$(plutil -extract 'UISupportedInterfaceOrientations~ipad' json -o - "$INFO_PLIST")"
          for orientation in \
            UIInterfaceOrientationPortrait \
            UIInterfaceOrientationPortraitUpsideDown \
            UIInterfaceOrientationLandscapeLeft \
            UIInterfaceOrientationLandscapeRight; do
            printf '%s' "$IPAD_ORIENTATIONS" | grep -q "$orientation" || {
              echo "::error:: iPad orientation $orientation is missing; App Store upload would fail validation."
              exit 1
            }
          done

          PRIVACY_MANIFEST="$APP_PATH/PrivacyInfo.xcprivacy"
          if [ ! -f "$PRIVACY_MANIFEST" ]; then
            echo "::error:: PrivacyInfo.xcprivacy is missing from the signed app bundle!"
            exit 1
          fi
          plutil -lint "$PRIVACY_MANIFEST"
          PRIVACY_XML="$(plutil -convert xml1 -o - "$PRIVACY_MANIFEST")"
          printf '%s' "$PRIVACY_XML" | grep -q "NSPrivacyAccessedAPICategoryUserDefaults" || {
            echo "::error:: Privacy manifest does not declare UserDefaults usage!"
            exit 1
          }
          printf '%s' "$PRIVACY_XML" | grep -q "CA92.1" || {
            echo "::error:: Privacy manifest is missing the app-local UserDefaults reason!"
            exit 1
          }
          printf '%s' "$PRIVACY_XML" | grep -q "NSPrivacyCollectedDataTypeEmailAddress" || {
            echo "::error:: Privacy manifest is missing XERT account data declarations!"
            exit 1
          }
          echo "Signed bundle verified: identifier, iPad orientations, export compliance, gated entitlements and privacy manifest present."
    artifacts:
      - ios/XertFitnessApp/build/test-results.xcresult
      - ios/XertFitnessApp/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
