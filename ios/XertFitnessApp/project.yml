name: XertFitness
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  XertFitness:
    type: application
    platform: iOS
    sources:
      - path: XertFitnessApp
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xertfitness.app
        PRODUCT_NAME: XertFitness
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        VERSIONING_SYSTEM: apple-generic
        INFOPLIST_FILE: XertFitnessApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: XertFitnessApp/XertFitnessApp.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    scheme:
      testTargets:
        - XertFitnessTests
        - XertFitnessUITests
  XertFitnessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: XertFitnessAppTests
    dependencies:
      - target: XertFitness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xertfitness.app.tests
        GENERATE_INFOPLIST_FILE: YES
  XertFitnessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: XertFitnessUITests
    dependencies:
      - target: XertFitness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xertfitness.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: XertFitness
